name: Build & Push OMAF Server (patched)

on:
  push:
    branches: [ "patch" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: omaf-server
  IMAGE_VERSION: v1.12-patched
  REPO_SUBDIR: OMAF-Server/server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make git build-essential

      - name: Build OMAF Server via CMake
        working-directory: ${{ env.REPO_SUBDIR }}
        run: |
          mkdir -p build
          cd build
          cmake ..
          make build -j"$(nproc)"

      - name: Set SHORT_SHA env
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: ${{ env.REPO_SUBDIR }}
          file: ${{ env.REPO_SUBDIR }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}-${{ env.SHORT_SHA }}

      - name: Summary
        run: |
          echo "[Success] Image published:"
          echo "   - ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}"
          echo "   - ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}-${{ env.SHORT_SHA }}"