name: Build & Push WebRTC Server (patched)

on:
  push:
    branches: [ "patch" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BUILT_IMAGE_NAME: owt-server
  IMAGE_NAME: webrtc-server
  IMAGE_VERSION_SUFFIX: -patched
  REPO_SUBDIR: WebRTC-Sample/owt-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make git build-essential curl

      - name: Build WebRTC Server via CMake (creates docker image)
        working-directory: ${{ env.REPO_SUBDIR }}
        run: |
          mkdir build
          cd build
          cmake ..
          make -j"$(nproc)"
          echo "--- Built Docker Images ---"
          docker image ls

      - name: Compute tags
        id: tags
        run: | 
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV
          echo "IMAGE_URI=ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
      
      - name: Smoke Test
        working-directory: ${{ env.REPO_SUBDIR }}/build
        run: |
          set -euo pipefail
          echo "[Info] Starting server using 'make start_owt_immersive_4k'..."
          make start_owt_immersive_4k

          echo "[Info] Waiting for container 'owt-immersive' to start (15s)..."
          sleep 15

          if curl -k -fsS https://localhost:8443/ >/dev/null 2>&1; then
            echo "[OK] Container is running on https://localhost:8443"
            docker rm -f owt-immersive
            exit 0
          else
            echo "[Error] Container did not respond on https://localhost:8443/"
            docker ps -a || true
            docker logs owt-immersive || true
            docker rm -f owt-immersive || true
            exit 1
          fi

      - name: Retag & Push built image
        run: |
          BUILT_IMG_TAG_REGEX="^${{ env.BUILT_IMAGE_NAME }}:v[0-9]+\.[0-9]+\.[0-9]+$"
          FINAL_IMG="$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E "$BUILT_IMG_TAG_REGEX" | head -n1)"

          if [ -z "$FINAL_IMG" ]; then
            echo "Error: Built image matching regex '$BUILT_IMG_TAG_REGEX' not found."
            docker image ls
            exit 1
          fi

          ORIGINAL_VERSION=$(echo "$FINAL_IMG" | cut -d':' -f2)
          FINAL_TAG="${ORIGINAL_VERSION}${IMAGE_VERSION_SUFFIX}"

          echo "FINAL_TAG=${FINAL_TAG}" >> $GITHUB_ENV

          echo "Found built image: $FINAL_IMG"
          echo "Tagging for push as: ${IMAGE_URI}:${FINAL_TAG}"
          
          docker tag "$FINAL_IMG" "${IMAGE_URI}:${FINAL_TAG}"
          docker tag "$FINAL_IMG" "${IMAGE_URI}:${FINAL_TAG}-${SHORT_SHA}"
          
          docker push "${IMAGE_URI}:${FINAL_TAG}"
          docker push "${IMAGE_URI}:${FINAL_TAG}-${SHORT_SHA}"

      - name: Summary
        run: |
          echo "[Success] Image published:"
          echo "   - ${IMAGE_URI}:${FINAL_TAG}"
          echo "   - ${IMAGE_URI}:${FINAL_TAG}-${SHORT_SHA}"