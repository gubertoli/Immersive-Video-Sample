name: Build & Push WebRTC Server

on:
  push:
    branches: [ "webrtc" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: webrtc-server
  IMAGE_TAG: latest
  REPO_SUBDIR: WebRTC-Sample/owt-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Image URI and Tags
        id: image_meta
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_URI="ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME }}"
          SHORT_SHA=${GITHUB_SHA::7}
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          echo "TAG_LATEST=${{ env.IMAGE_TAG }}" >> $GITHUB_ENV
          echo "TAG_SHA=${{ env.IMAGE_TAG }}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.REPO_SUBDIR }}
          file: ${{ env.REPO_SUBDIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_URI }}:${{ env.TAG_LATEST }}
            ${{ env.IMAGE_URI }}:${{ env.TAG_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "[Success] Image published based on README build:"
          echo "  - ${{ env.IMAGE_URI }}:${{ env.TAG_LATEST }}"
          echo "  - ${{ env.IMAGE_URI }}:${{ env.TAG_SHA }}"