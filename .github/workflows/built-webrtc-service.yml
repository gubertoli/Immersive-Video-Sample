name: Build & Push WebRTC Server

on:
  push:
    branches: [ "webrtc" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BUILT_IMAGE_NAME: xeon-centos76-service-owt-immersive
  BUILT_IMAGE_TAG: latest
  IMAGE_NAME: webrtc-server
  IMAGE_VERSION_SUFFIX: patched
  REPO_SUBDIR: WebRTC-Sample/owt-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake make git build-essential curl docker-compose

      - name: Build WebRTC Server via CMake (creates docker image)
        working-directory: ${{ env.REPO_SUBDIR }}
        run: |
          mkdir build
          cd build
          cmake ..
          make -j"$(nproc)"
          echo "--- Built Docker Images ---"
          docker image ls

      - name: Compute tags
        id: tags
        run: | 
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV
          echo "IMAGE_URI=ghcr.io/${OWNER_LC}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
      
      - name: Smoke Test
        working-directory: ${{ env.REPO_SUBDIR }}/build
        run: |
          set -euo pipefail
          
          echo "[Info] Starting server using 'make start_owt_immersive_4k'..."
          make start_owt_immersive_4k
          
          # The container name is 'owt-immersive' (defined in CMakeLists.txt)
          echo "[Info] Waiting for container 'owt-immersive' to start (15s)..."
          sleep 15
          
          if curl -k -fsS https://localhost:8443/ >/dev/null 2>&1; then
            echo "[OK] Container is running on https://localhost:8443"
            docker rm -f owt-immersive
            exit 0
          else
            echo "[Error] Container did not respond on https://localhost:8443/"
            docker ps -a || true
            docker logs owt-immersive || true
            docker rm -f owt-immersive || true
            exit 1
          fi

      - name: Retag & Push built images
        run: |
          # --- Image 1 (The main immersive image) ---
          IMG_1_LOCAL="${{ env.BUILT_IMAGE_NAME }}:${{ env.BUILT_IMAGE_TAG }}"
          IMG_1_TAG_FINAL="${{ env.BUILT_IMAGE_TAG }}-${{ env.IMAGE_VERSION_SUFFIX }}" # "latest-patched"
          IMG_1_URI="${{ env.IMAGE_URI }}"
          
          if ! docker image inspect "$IMG_1_LOCAL" &> /dev/null; then
            echo "Error: Built image '$IMG_1_LOCAL' not found."
            docker image ls
            exit 1
          fi

          echo "Tagging $IMG_1_LOCAL as ${IMG_1_URI}:${IMG_1_TAG_FINAL}"
          docker tag "$IMG_1_LOCAL" "${IMG_1_URI}:${IMG_1_TAG_FINAL}"
          docker tag "$IMG_1_LOCAL" "${IMG_1_URI}:${IMG_1_TAG_FINAL}-${SHORT_SHA}"
          
          docker push "${IMG_1_URI}:${IMG_1_TAG_FINAL}"
          docker push "${IMG_1_URI}:${IMG_1_TAG_FINAL}-${SHORT_SHA}"

          # --- Image 2 (The owt-server image) ---
          IMG_2_LOCAL="owt-server:v5.0.4"
          IMG_2_REMOTE_NAME="owt-server"
          IMG_2_TAG_FINAL="v5.0.4-${{ env.IMAGE_VERSION_SUFFIX }}" # "v5.0.4-patched"
          IMG_2_URI="ghcr.io/${OWNER_LC}/${IMG_2_REMOTE_NAME}"
          
          if ! docker image inspect "$IMG_2_LOCAL" &> /dev/null; then
            echo "Error: Built image '$IMG_2_LOCAL' not found."
            docker image ls
            exit 1
          fi

          echo "Tagging $IMG_2_LOCAL as ${IMG_2_URI}:${IMG_2_TAG_FINAL}"
          docker tag "$IMG_2_LOCAL" "${IMG_2_URI}:${IMG_2_TAG_FINAL}"
          docker tag "$IMG_2_LOCAL" "${IMG_2_URI}:${IMG_2_TAG_FINAL}-${SHORT_SHA}"

          docker push "${IMG_2_URI}:${IMG_2_TAG_FINAL}"
          docker push "${IMG_2_URI}:${IMG_2_TAG_FINAL}-${SHORT_SHA}"

          echo "IMG_1_URI_TAG=${IMG_1_URI}:${IMG_1_TAG_FINAL}" >> $GITHUB_ENV
          echo "IMG_1_URI_TAG_SHA=${IMG_1_URI}:${IMG_1_TAG_FINAL}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "IMG_2_URI_TAG=${IMG_2_URI}:${IMG_2_TAG_FINAL}" >> $GITHUB_ENV
          echo "IMG_2_URI_TAG_SHA=${IMG_2_URI}:${IMG_2_TAG_FINAL}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Summary
        run: |
          echo "[Success] 2 images published:"
          echo ""
          echo "Immersive Service Image:"
          echo "  - ${IMG_1_URI_TAG}"
          echo "  - ${IMG_1_URI_TAG_SHA}"
          echo ""
          echo "Media Server Image:"
          echo "  - ${IMG_2_URI_TAG}"
          echo "  - ${IMG_2_URI_TAG_SHA}"